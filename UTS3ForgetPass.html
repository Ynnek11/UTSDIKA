<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORGOT PASSWORD</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #000000;
    }
  
  </style>
</head>
<body>

  <div>
    <h2>FORGOT PASSWORD</h2>

    <form>
        <input type="teks" placeholder="Username Anda" required>
        <input type="password" placeholder="Masukkan Password Baru" required>
        <input type="konfirmasi password" placeholder="Masukkan Password Sekali Lagi" required>
        <button type="submit">Ganti Password</button>
    </form>
  
  </div>

</body>
</html>
